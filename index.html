    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
            min-height: 100vh;
        }

        /* ------------------ 通用视图样式 ------------------ */
        .view {
            transition: opacity 0.3s ease-in-out;
        }

        /* ------------------ 复习卡片样式 ------------------ */
        .flip-card {
            perspective: 1000px;
            height: 130px; 
            @media (min-width: 640px) { height: 150px; } 
            @media (min-width: 1024px) { height: 160px; }
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 0.75rem;
        }
        /* 桌面端/支持 hover 的设备，鼠标悬停翻转 */
        .flip-card:hover .flip-card-inner {
            transform: rotateY(180deg);
        }
        /* 触摸设备上的翻转控制 */
        .flip-card-inner.flipped {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white; 
        }
        /* 正面：蓝底 */
        .flip-card-front {
            background-color: #3b82f6; 
        }
        /* 背面：绿底 */
        .flip-card-back {
            background-color: #10b981; 
            transform: rotateY(180deg);
            padding: 0.5rem; 
        }
        .phonetic { font-size: 0.8rem; opacity: 0.9; }
        .word { font-size: 1.25rem; font-weight: 700; }
        .definition { font-size: 0.9rem; margin-top: 0.25rem; line-height: 1.3; }

        /* ------------------ 游戏卡片样式 ------------------ */
        .game-card {
            background-color: #3b82f6; /* 蓝底 */
            color: white;
            border-radius: 0.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            user-select: none;
            height: 100px; /* 固定高度 */
            font-size: 0.9rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            word-break: break-word;
        }
        /* 释义卡片使用绿底 */
        .game-card.type-definition {
             background-color: #10b981; 
        }
        /* 选中时的特殊效果 */
        .game-card.selected {
            transform: scale(1.05);
            box-shadow: 0 0 0 3px #facc15; /* yellow-400 边框 */
        }
        /* 匹配成功后的消失效果 */
        .game-card.matched {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }
        /* 匹配失败的晃动效果 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .game-card.mismatch {
            animation: shake 0.4s ease-in-out;
        }
    </style>

        let allWords = []; // 存储所有解析后的单词数据

        /**
         * Function to switch between different views (divs) in the single file
         * @param {string} targetViewId - The ID of the view to show (e.g., 'review-view', 'game-view')
         */
        function navigateTo(targetViewId) {
            const views = document.querySelectorAll('.view');
            
            views.forEach(view => {
                // 立即隐藏所有视图
                view.style.display = 'none'; 
                view.style.opacity = 0;
            });

            const targetView = document.getElementById(targetViewId);
            if (targetView) {
                // 延迟显示目标视图，以允许 CSS 动画生效
                setTimeout(() => {
                    targetView.style.display = 'block'; 
                    targetView.style.opacity = 1;
                }, 10);
                
                // 如果切换到游戏视图，确保游戏数据已加载且网格已渲染
                if (targetViewId === 'game-view') {
                    // 如果 matchedCount 为 0 (新游戏或刚进入)，则重启游戏
                    if (matchedCount === 0) {
                        restartGame(); 
                    } else {
                        // 否则保持当前游戏状态（如果用户只是暂时返回复习页）
                        renderGameGrid();
                    }
                }
            }
        }

        /**
         * 解析 CSV 字符串为对象数组
         */
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',');
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                // 确保行有正确的列数
                if (values.length === headers.length) {
                    let wordEntry = {};
                    headers.forEach((header, index) => {
                        let key;
                        switch (header.trim()) {
                            case '序号': key = 'id'; break;
                            case '单词': key = 'word'; break;
                            case '音标': key = 'phonetic'; break;
                            case '词性': key = 'partOfSpeech'; break;
                            case '中文释义': key = 'definition'; break;
                            default: key = header.trim();
                        }
                        wordEntry[key] = values[index].trim();
                    });
                    data.push(wordEntry);
                }
            }
            return data;
        }

                    <span class="text-xs absolute top-2 left-3 opacity-75">#${wordData.id}</span>
                    <h2 class="word">${wordData.word}</h2>
                    <p class="phonetic mt-1">${wordData.phonetic}</p>
                </div>
                <div class="flip-card-back">
                    <p class="definition text-center px-1">
                        <span class="font-semibold">${wordData.partOfSpeech}</span> ${wordData.definition}
                    </p>
                </div>
            `;
            cardWrapper.appendChild(innerDiv);

            // 添加点击事件，用于翻转卡片（适用于触摸和鼠标）
            cardWrapper.addEventListener('click', () => {
                const inner = cardWrapper.querySelector('.flip-card-inner');
                inner.classList.toggle('flipped');
            });

            return cardWrapper;
        }

        /**
         * 渲染当前页的单词卡片
         */
        function renderCurrentPage() {
            container.innerHTML = ''; // 清空现有内容

            const startIndex = (currentPage - 1) * CARDS_PER_PAGE;
            const endIndex = startIndex + CARDS_PER_PAGE;
            const wordsToShow = allWords.slice(startIndex, endIndex);

            wordsToShow.forEach(word => {
                const card = createFlashcard(word);
                container.appendChild(card);
            });

            updatePaginationControls();
        }

        /**
         * 更新分页按钮状态和页码信息
         */
        function updatePaginationControls() {
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            pageInfo.textContent = `第 ${currentPage} 页 / 共 ${totalPages} 页`;
        }

        /**
         * 切换到上一页
         */
        function goToPrevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderCurrentPage();
            }
        }

        /**
         * 切换到下一页
         */
        function goToNextPage() {
            if (currentPage < totalPages) {
                currentPage++;
                renderCurrentPage();
            }
        }
        
        // ----------------------------------------------------
        // III. 单词匹配游戏逻辑 (Game View Logic)
        // ----------------------------------------------------

        // 游戏状态变量
        let gamePairs = []; 
        let selectedCards = [];
        let matchedCount = 0;
        let isProcessing = false; 

        const GRID_SIZE = 16;
        const PAIR_COUNT = GRID_SIZE / 2; // 8 对

        // 元素引用
        const gameGrid = document.getElementById('game-grid');
        const matchedCountEl = document.getElementById('matched-count');
        const totalPairsEl = document.getElementById('total-pairs');
        const restartBtn = document.getElementById('restart-btn');
        const modalRestartBtn = document.getElementById('modal-restart-btn');
        const winModal = document.getElementById('win-modal');
        const finalPairsEl = document.getElementById('final-pairs');
        
        /**
         * Fisher-Yates 洗牌算法
         */
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * 初始化游戏卡片数据 (从所有单词中随机选取 PAIR_COUNT 个单词)
         */
        function initializeGameData() {
            if (allWords.length < PAIR_COUNT) {
                 console.error("单词数量不足，无法创建足够的匹配对。");
                 return;
            }

            // 1. 随机选取 PAIR_COUNT 个单词
            const shuffledWords = [...allWords];
            shuffle(shuffledWords);
            // 确保使用独特的 ID，虽然 allWords 已经是独特的，但为了健壮性
            const wordsForGame = shuffledWords.slice(0, PAIR_COUNT); 

            gamePairs = [];
            
            // 2. 为每个选中的单词创建两个卡片项：单词和释义
            wordsForGame.forEach((word) => {
                // 使用原始 ID 作为匹配 ID，加上随机数以确保临时唯一性
                const pairId = `p${word.id}-${Math.random()}`; 
                
                // 单词卡片 (蓝底)
                gamePairs.push({ 
                    id: pairId, 
                    type: 'word', 
                    content: word.word,
                    displayText: word.word // 游戏卡片只显示单词
                });

                // 释义卡片 (绿底)
                gamePairs.push({ 
                    id: pairId, 
                    type: 'definition', 
                    content: word.definition,
                    displayText: `${word.partOfSpeech} ${word.definition}` // 显示词性和释义
                });
            });

            shuffle(gamePairs); // 随机打乱卡片顺序
            totalPairsEl.textContent = PAIR_COUNT;
        }

        /**
         * 渲染游戏网格
         */
        function renderGameGrid() {
            gameGrid.innerHTML = '';
            
            gamePairs.forEach(cardData => {
                const card = document.createElement('div');
                card.classList.add('game-card', 'p-2', 'transition', 'duration-300', `type-${cardData.type}`);
                card.textContent = cardData.displayText;
                
                // 应用当前状态
                if (cardData.matched) {
                     card.classList.add('matched');
                }
                if (cardData.selected) {
                    card.classList.add('selected');
                }
                
                card.dataset.id = cardData.id;
                card.dataset.type = cardData.type;

                // 只有未匹配的卡片才能点击
                if (!cardData.matched) {
                    card.addEventListener('click', () => handleCardClick(card));
                }
                
                gameGrid.appendChild(card);
            });
        }

        /**
         * 处理卡片点击事件
         */
        function handleCardClick(card) {
            // 阻止处理中、已选中或已匹配的卡片
            if (isProcessing || card.classList.contains('selected') || card.classList.contains('matched')) {
                return;
            }

            card.classList.add('selected');
            selectedCards.push(card);

            if (selectedCards.length === 2) {
                isProcessing = true;
                checkForMatch();
            }
        }

        /**
         * 检查两张选中的卡片是否匹配
         */
        function checkForMatch() {
            const [card1, card2] = selectedCards;
            const isPair = card1.dataset.id === card2.dataset.id;
            const isDifferentType = card1.dataset.type !== card2.dataset.type;

            if (isPair && isDifferentType) {
                // 匹配成功
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    card1.classList.remove('selected');
                    card2.classList.remove('selected');
                    
                    // 从 gamePairs 中标记为已匹配 (可选，但有助于状态管理)
                    // 实际效果通过类名控制，这里省略状态更新以保持简单

                    matchedCount++;
                    matchedCountEl.textContent = matchedCount;

                    if (matchedCount === PAIR_COUNT) {
                        showWinModal();
                    }
                    resetTurn();
                }, 400);

            } else {
                // 匹配失败
                card1.classList.add('mismatch');
                card2.classList.add('mismatch');
                
                setTimeout(() => {
                    card1.classList.remove('selected', 'mismatch');
                    card2.classList.remove('selected', 'mismatch');
                    resetTurn();
                }, 1000);
            }
        }

        /**
         * 重置当前回合状态
         */
        function resetTurn() {
            selectedCards = [];
            isProcessing = false;
        }

        /**
         * 显示胜利弹窗
         */
        function showWinModal() {
            finalPairsEl.textContent = PAIR_COUNT;
            winModal.classList.remove('hidden');
            winModal.classList.add('flex');
        }

        /**
         * 隐藏胜利弹窗
         */
        function hideWinModal() {
            winModal.classList.add('hidden');
            winModal.classList.remove('flex');
        }

        /**
         * 重新开始游戏
         */
        function restartGame() {
            hideWinModal();
            selectedCards = [];
            matchedCount = 0;
            isProcessing = false;
            matchedCountEl.textContent = 0;
            
            initializeGameData();
            renderGameGrid();
        }

        // ----------------------------------------------------
        // IV. 应用程序初始化
        // ----------------------------------------------------

        function initApp() {
            // 1. 初始化所有单词数据
            allWords = parseCSV(csvData);
            totalPages = Math.ceil(allWords.length / CARDS_PER_PAGE);

            // 2. 绑定复习页面的分页按钮事件
            prevBtn.addEventListener('click', goToPrevPage);
            nextBtn.addEventListener('click', goToNextPage);

            // 3. 绑定游戏页面的重启按钮事件
            restartBtn.addEventListener('click', restartGame);
            modalRestartBtn.addEventListener('click', restartGame);

            // 4. 初始渲染复习卡片视图
            renderCurrentPage();
            
            // 5. 确保总数显示正确
            totalPairsEl.textContent = PAIR_COUNT;

            // 6. 首次加载时，初始化游戏数据，但不要渲染，等待用户点击
            initializeGameData(); 
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
